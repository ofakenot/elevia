<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fce8f0">
<title>Elevia — Skin Science Premium</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --rose:       #d4547a;
  --rose2:      #e8758f;
  --rose3:      #f09ab0;
  --rose-dark:  #9a2e50;
  --rose-soft:  rgba(212,84,122,.08);
  --rose-glow:  rgba(212,84,122,.25);
  --white:      #ffffff;
  --bg-body:    #fce8f0;
  --bg-mesh1:   #fad0df;
  --bg-mesh2:   #f5c0d0;
  --text:       #1a0a10;
  --muted:      #7a4055;
  --muted2:     #c090a0;
  --glass:      rgba(255,255,255,0.28);
  --glass2:     rgba(255,255,255,0.18);
  --glass-border: rgba(255,255,255,0.55);
  --glass-border2: rgba(255,255,255,0.35);
  --shadow:     0 8px 32px rgba(212,84,122,.13), 0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:  0 20px 60px rgba(212,84,122,.18), 0 4px 16px rgba(0,0,0,.08);
}

html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg-body);
  color: var(--text);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.5;
}
.hidden{display:none!important}

/* ── MESH BACKGROUND ── */
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 10% 20%, rgba(248,190,210,.6), transparent),
    radial-gradient(ellipse 60% 70% at 90% 80%, rgba(240,160,185,.5), transparent),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,230,240,.4), transparent),
    linear-gradient(160deg, #fce8f0 0%, #f8d0e2 40%, #f5c8d8 100%);
}

body::after{
  content:'';
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:150px;
}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rose3);border-radius:4px}

.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--glass-border)}
.glass2{background:var(--glass2);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--glass-border2)}

@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes scanline{from{left:-200%}30%{left:200%}to{left:200%}}
@keyframes rosePulse{0%,100%{box-shadow:0 0 0 0 rgba(212,84,122,0)}60%{box-shadow:0 0 0 6px rgba(212,84,122,.15)}}
@keyframes roseGlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes blobDrift{0%,100%{transform:scale(1) translate(0,0)}33%{transform:scale(1.08) translate(20px,-15px)}66%{transform:scale(.95) translate(-10px,20px)}}

.animate-up{animation:slideUp .4s ease-out both}

/* ────── HEADER ────── */
.header{
  position:sticky;top:0;z-index:200;
  height:56px;padding:0 1rem;
  display:flex;align-items:center;justify-content:space-between;
  overflow:hidden;
  background:rgba(252,232,240,.75);
  backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border-bottom:1px solid rgba(255,255,255,.6);
  box-shadow:0 1px 20px rgba(212,84,122,.08);
}
.header::after{
  content:'';position:absolute;top:0;left:-200%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.15) 50%,transparent 100%);
  animation:scanline 9s infinite;
}
.header-logo{height:2rem;object-fit:contain;z-index:2;filter:drop-shadow(0 2px 6px rgba(212,84,122,.2))}
.header-center{
  position:absolute;left:50%;transform:translateX(-50%);
  font-family:Arial,sans-serif;
  font-size:.65rem;letter-spacing:.25rem;color:var(--muted);
  pointer-events:none;z-index:2;white-space:nowrap;text-transform:uppercase;
}
.header-btn{
  width:36px;height:36px;
  background:rgba(255,255,255,.4);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.6);
  border-radius:10px;color:var(--rose);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .25s;z-index:2;
}
.header-btn:hover{background:var(--rose);color:var(--white);border-color:var(--rose);box-shadow:0 4px 16px rgba(212,84,122,.3)}
.header-btn svg{width:18px;height:18px}

/* ────── CAT BAR ────── */
.cat-bar {
  position:sticky;top:56px;z-index:100;padding:0.7rem 0;
  background:rgba(255,255,255,0.4);
  backdrop-filter:blur(25px) saturate(1.4);
  -webkit-backdrop-filter:blur(25px) saturate(1.4);
  border-bottom:0.5px solid rgba(0,0,0,0.12);
}
.cat-list{display:flex;gap:.6rem;padding:0 1.2rem;overflow-x:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-list::-webkit-scrollbar{display:none}
.cat-btn{
  flex-shrink:0;display:flex;align-items:center;gap:.4rem;padding:.5rem 1.1rem;
  background:rgba(0,0,0,.04);border:0.5px solid rgba(0,0,0,.05);border-radius:999px;
  color:#666;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  font-size:.75rem;font-weight:500;letter-spacing:-.1px;white-space:nowrap;
  cursor:pointer;transition:all .2s cubic-bezier(.25,1,.5,1);
}
.cat-btn:hover{background:rgba(0,0,0,.08);color:#111}
.cat-btn.active,.cat-btn[data-category="serum"].active{
  background:#d4547a;border-color:rgba(0,0,0,.05);color:#fff;font-weight:600;
  box-shadow:0 4px 12px rgba(212,84,122,.2);
}
.cat-btn[data-category="serum"]{border-color:rgba(0,0,0,.05);color:#666}
.cat-btn[data-category="serum"]:hover{color:#111}
.cat-drop-badge{width:14px;height:14px;background:rgba(0,0,0,.1);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.cat-btn.active .cat-drop-badge{background:rgba(255,255,255,.25)}
.cat-drop-badge svg{width:8px;height:8px;fill:currentColor}

/* ────── PRODUCTS ────── */
.products-wrap{padding:1.75rem 1rem 8rem;position:relative;z-index:2}
.section-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.section-title{font-family:Arial,sans-serif;font-size:1.2rem;font-weight:700;letter-spacing:.04em;color:var(--text)}
.section-count{
  font-family:Arial,sans-serif;font-size:.65rem;font-weight:700;color:var(--muted);
  background:rgba(255,255,255,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.6);padding:.25rem .75rem;border-radius:999px;letter-spacing:.5px;
}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.85rem}
@media(min-width:600px){.product-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.product-grid{grid-template-columns:repeat(4,1fr)}.products-wrap{padding:2rem 2rem 8rem}}

/* ────── CARD ────── */
.card{
  background:rgba(255,255,255,.45);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:0.5px solid rgba(0,0,0,.1);border-radius:1.2rem;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,.03),0 1px 3px rgba(0,0,0,.02);
  transition:transform .3s cubic-bezier(.25,1,.5,1),background-color .3s ease,box-shadow .3s cubic-bezier(.25,1,.5,1);
}
.card:hover{transform:translateY(-4px);background-color:rgba(255,255,255,.6);border-color:rgba(212,84,122,.25);box-shadow:0 12px 30px rgba(0,0,0,.06),0 4px 10px rgba(212,84,122,.05)}
.card.is-serum::after{display:none}
.card-img-wrap{position:relative;width:100%;aspect-ratio:1/1;background:rgba(255,255,255,.3);overflow:hidden;border-bottom:0.5px solid rgba(0,0,0,.08)}
.card-slider{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.card-slider::-webkit-scrollbar{display:none}
.card-slide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-slide img{width:75%;height:75%;object-fit:contain;display:block;transition:transform .4s cubic-bezier(.25,1,.5,1)}
.card:hover .card-slide img{transform:scale(1.04)}
.card-img-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;color:#888;background:rgba(0,0,0,.02)}
.card-img-placeholder svg{width:32px;height:32px;opacity:.3}
.card-img-placeholder span{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;opacity:.5}
.card-badge{
  position:absolute;top:.75rem;left:.75rem;padding:.25rem .6rem;
  background:rgba(255,255,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:0.5px solid rgba(0,0,0,.05);color:#d4547a;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:.6rem;font-weight:600;letter-spacing:-.1px;
  border-radius:.5rem;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.03);
}
.swipe-hint{
  position:absolute;bottom:.75rem;right:.75rem;background:rgba(0,0,0,.04);color:#666;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:0.5px solid rgba(0,0,0,.02);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:8px;font-weight:500;
  padding:3px 8px;border-radius:6px;pointer-events:none;z-index:5;
}
.card-body{padding:1.1rem;flex-grow:1;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:1}
.card-name{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  font-size:.88rem;font-weight:600;letter-spacing:-.1px;color:#111;margin-bottom:.3rem;line-height:1.25;
  display:flex;align-items:center;flex-wrap:wrap;gap:3px;
}
.card-desc{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:.72rem;color:#666;line-height:1.5;margin-bottom:.85rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-cta{
  width:100%;height:42px;display:flex;align-items:center;justify-content:center;gap:.5rem;
  background:linear-gradient(135deg,var(--rose),var(--rose2));color:var(--white);
  border:none;border-radius:.85rem;cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.3px;
  transition:all .25s;box-shadow:0 4px 14px rgba(212,84,122,.25);position:relative;overflow:hidden;
}
.card-cta::after{content:'';position:absolute;top:0;left:-200%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:scanline 8s infinite}
.card-cta:hover{filter:brightness(1.06);transform:scale(1.02);box-shadow:0 6px 20px rgba(212,84,122,.35)}
.card-cta svg{width:14px;height:14px}

/* ────── BOT NAV ────── */
.bot-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  padding:0 1rem env(safe-area-inset-bottom,.75rem);
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(28px) saturate(2);
  -webkit-backdrop-filter:blur(28px) saturate(2);
  border-top:0.5px solid rgba(0,0,0,.08);
  box-shadow:0 -4px 20px rgba(212,84,122,.06);
}
.bot-nav-inner{
  max-width:600px;margin:0 auto;
  display:flex;justify-content:space-around;align-items:center;
  height:56px;position:relative;
}
.nav-glow{
  position:absolute;bottom:-4px;width:40px;height:3px;
  background:linear-gradient(90deg,transparent,var(--rose),transparent);
  border-radius:2px;opacity:0;transition:left .3s cubic-bezier(.25,1,.5,1),opacity .3s;
  transform:translateX(-50%);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:.4rem .6rem;border:none;background:transparent;
  color:#999;cursor:pointer;transition:color .2s,transform .2s;
  -webkit-tap-highlight-color:transparent;outline:none;position:relative;
}
.nav-item.active{color:#d4547a;transform:scale(1.05)}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s ease,filter .2s ease}
.nav-item.active svg{filter:drop-shadow(0 2px 4px rgba(212,84,122,.25))}
.nav-label{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:10px;font-weight:500;letter-spacing:-.1px;margin-top:4px}
.nav-item .nav-tooltip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  padding:4px 10px;background:rgba(30,30,30,.75);color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:11px;font-weight:500;
  border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;
  transition:opacity .15s ease;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}
.nav-item:hover .nav-tooltip{opacity:1}

/* ────── MODAL ────── */
.modal-overlay{
  position:fixed;inset:0;z-index:2000;background:rgba(26,10,16,.5);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;
}
.modal-overlay.active{opacity:1;visibility:visible}
.modal-box{
  background:rgba(255,255,255,.75);backdrop-filter:blur(28px) saturate(2);-webkit-backdrop-filter:blur(28px) saturate(2);
  border:1px solid rgba(255,255,255,.75);border-bottom:none;
  width:100%;max-width:480px;max-height:88vh;
  border-radius:2rem 2rem 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .45s cubic-bezier(.16,1,.3,1);overflow:hidden;
  box-shadow:0 -8px 40px rgba(212,84,122,.15);
}
.modal-overlay.active .modal-box{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:rgba(212,84,122,.25);border-radius:2px;margin:.75rem auto .25rem}
.modal-head{padding:.5rem 1.25rem .75rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.5)}
.modal-close-btn{
  width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);
  color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;
}
.modal-close-btn:hover{background:var(--rose);color:var(--white);border-color:var(--rose)}
.modal-body{overflow-y:auto;padding:1.25rem;flex:1}
.modal-img-wrap{aspect-ratio:1;background:rgba(255,220,235,.35);border-radius:1.25rem;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.6)}
.modal-img-wrap .card-slider{width:100%;height:100%}
.modal-img-wrap .card-slide img{width:65%;height:65%}
.modal-badge{
  display:inline-block;padding:.28rem .7rem;
  background:linear-gradient(135deg,var(--rose),var(--rose2));color:var(--white);
  font-family:Arial,sans-serif;font-size:.58rem;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;border-radius:.5rem;margin:1rem 0 .5rem;
  box-shadow:0 2px 10px rgba(212,84,122,.3);
}
.modal-name{font-family:Arial,sans-serif;font-size:1.4rem;font-weight:700;color:var(--text);margin-bottom:.4rem;line-height:1.25;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.modal-desc{font-family:Arial,sans-serif;color:var(--muted);font-size:.85rem;line-height:1.6;margin-bottom:1.25rem}
.modal-feat{display:flex;align-items:center;gap:.7rem;padding:.65rem .9rem;background:rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.65);border-radius:.85rem;margin-bottom:.4rem}
.modal-feat svg{width:1.1rem;height:1.1rem;flex-shrink:0;color:var(--rose)}
.modal-feat span{font-family:Arial,sans-serif;font-size:.8rem;color:var(--text);font-weight:500}
.modal-foot{padding:1rem 1.25rem 1.25rem;border-top:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.modal-wa{
  display:flex;align-items:center;justify-content:center;gap:.65rem;
  width:100%;height:3.25rem;background:linear-gradient(135deg,var(--rose),var(--rose2));color:var(--white);
  border-radius:1rem;text-decoration:none;font-family:Arial,sans-serif;font-weight:700;font-size:.88rem;letter-spacing:.5px;
  transition:all .25s;box-shadow:0 6px 24px rgba(212,84,122,.3);position:relative;overflow:hidden;
}
.modal-wa::after{content:'';position:absolute;top:0;left:-200%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:scanline 6s infinite}
.modal-wa:hover{filter:brightness(1.08);transform:scale(1.01);box-shadow:0 8px 32px rgba(212,84,122,.4)}

/* ────── SEARCH ────── */
.search-over{
  position:fixed;inset:0;z-index:1500;background:rgba(252,232,240,.7);
  backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
  opacity:0;visibility:hidden;transition:all .3s;
}
.search-over.active{opacity:1;visibility:visible}
.search-top{display:flex;align-items:center;gap:.75rem;padding:.9rem 1rem;border-bottom:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.search-back{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.search-back:hover{background:var(--rose);color:var(--white);border-color:var(--rose)}
.search-in-wrap{flex:1;position:relative}
.search-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted2)}
.search-input{width:100%;padding:.7rem 1rem .7rem 2.5rem;background:rgba(255,255,255,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:10px;color:var(--text);font-family:Arial,sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
.search-input:focus{border-color:rgba(212,84,122,.5)}
.search-input::placeholder{color:var(--muted2)}
.search-results{padding:1rem;overflow-y:auto;max-height:calc(100vh - 70px)}
.search-empty{text-align:center;padding:4rem 1.5rem;color:var(--muted);font-family:Arial,sans-serif;font-size:.9rem}

/* ────── CATEGORIES VIEW ────── */
.cats-view{min-height:100vh;padding-bottom:9rem;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2}
.cats-container{width:100%;max-width:600px;padding:0 1.2rem}
.cats-header{padding:3rem 0 1.75rem;text-align:center}
.cats-title{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:1.9rem;font-weight:700;letter-spacing:-.4px;color:#111}
.cats-sub{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:#666;font-size:.9rem;margin-top:.3rem}
.cat-card{
  display:flex;align-items:center;gap:1.1rem;padding:0 1.25rem;height:84px;
  background:rgba(255,255,255,.45);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:0.5px solid rgba(0,0,0,.1);border-radius:1.25rem;margin-bottom:.75rem;cursor:pointer;
  text-decoration:none;width:100%;box-shadow:0 4px 16px rgba(0,0,0,.02);
  transition:transform .25s cubic-bezier(.25,1,.5,1),background-color .25s ease,border-color .25s ease,box-shadow .25s cubic-bezier(.25,1,.5,1);
}
.cat-card:hover{background-color:rgba(255,255,255,.6);border-color:rgba(212,84,122,.25);transform:translateX(4px);box-shadow:0 8px 24px rgba(0,0,0,.05)}

<!-- ═══════════════════════════════════
     LIQUID CANVAS
═══════════════════════════════════ -->
<script>
(function(){
  const c=document.getElementById('liquid-canvas');if(!c)return;
  const ctx=c.getContext('2d');let W,H,blobs;
  function resize(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}
  function mk(){return{x:Math.random()*W,y:Math.random()*H,r:90+Math.random()*110,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,h:320+Math.random()*40,a:.06+Math.random()*.07}}
  function init(){blobs=Array.from({length:5},mk)}
  function draw(){
    ctx.clearRect(0,0,W,H);
    blobs.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<-b.r||b.x>W+b.r)b.vx*=-1;if(b.y<-b.r||b.y>H+b.r)b.vy*=-1;const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);g.addColorStop(0,`hsla(${b.h},75%,72%,${b.a})`);g.addColorStop(1,`hsla(${b.h},75%,72%,0)`);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill()});
    requestAnimationFrame(draw);
  }
  resize();init();draw();
  window.addEventListener('resize',()=>{resize();init()});
})();
</script>

<script>
(function(){
  document.querySelectorAll('.luxury-text-flipper').forEach(container=>{
    const words=container.querySelectorAll('.flip-word');if(!words.length)return;
    let cur=0;
    setInterval(()=>{
      const prev=words[cur];cur=(cur+1)%words.length;const next=words[cur];
      prev.classList.remove('active');prev.classList.add('leaving');
      setTimeout(()=>prev.classList.remove('leaving'),800);
      next.classList.add('active');
    },2400);
  });
})();
</script>

const verifiedBadge=`<svg style="display:inline-block;width:14px;height:14px;margin-left:4px;vertical-align:middle;flex-shrink:0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10.5213 2.62368C11.3147 1.75255 12.6853 1.75255 13.4787 2.62368L14.4989 3.74371C14.8282 4.10519 15.3083 4.30403 15.8115 4.28786L17.3686 4.23793C18.5807 4.19907 19.5991 5.21739 19.5602 6.42953L19.5103 7.98663C19.4941 8.48981 19.6929 8.96993 20.0544 9.29924L21.1745 10.3194C22.0456 11.1128 22.0456 12.4833 21.1745 13.2767L20.0544 14.2969C19.6929 14.6262 19.4941 15.1063 19.5103 15.6095L19.5602 17.1666C19.5991 18.3787 18.5807 19.3971 17.3686 19.3582L15.8115 19.3083C15.3083 19.2921 14.8282 19.491 14.4989 19.8524L13.4787 20.9724C12.6853 21.8436 11.3147 21.8436 10.5213 20.9724L9.50113 19.8524C9.17182 19.491 8.6917 19.2921 8.18852 19.3083L6.63139 19.3582C5.41926 19.3971 4.40094 18.3787 4.43979 17.1666L4.48972 15.6095C4.5059 15.1063 4.30706 14.6262 3.94558 14.2969L2.82548 13.2767C1.95435 12.4833 1.95435 11.1128 2.82548 10.3194L3.94558 9.29924C4.30706 8.96993 4.5059 8.48981 4.48972 7.98663L4.43979 6.42953C4.40094 5.21739 5.41926 4.19907 6.63139 4.23793L8.18852 4.28786C8.6917 4.30403 9.17182 4.10519 9.50113 3.74371L10.5213 2.62368Z" fill="#d4547a"/><path d="M9 12L11 14L15 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const productData = {
  pt: [
    {id:1,name:"GHK-Cu & PDRN",nameHtml:`GHK-CU & PDRN${verifiedBadge}`,description:"Sérum de alta performance com peptídeo cobre GHK-Cu e PDRN. Estimula colágeno, regenera células e proporciona hidratação intensa 24h. Absorção avançada para renovação completa da pele.",badge:"Sérum",category:"serum",images:["./images/p1.png","./images/p2.png","./images/p3.png"],whatsappMessage:"Olá! Tenho interesse no Sérum GHK-Cu & PDRN da Elevia"}
  ],
  en: [
    {id:1,name:"GHK-Cu & PDRN Serum",nameHtml:`GHK-CU & PDRN Serum${verifiedBadge}`,description:"High-performance serum with copper peptide GHK-Cu and PDRN. Stimulates collagen, regenerates cells and provides intense 24h hydration. Advanced absorption for complete skin renewal.",badge:"Serum",category:"serum",images:["./images/p1.png","./images/p2.png","./images/p3.png"],whatsappMessage:"Hello! I'm interested in the GHK-Cu & PDRN Serum from Elevia"}
  ],
  es: [
    {id:1,name:"GHK-Cu & PDRN",nameHtml:`GHK-CU & PDRN${verifiedBadge}`,description:"Sérum de alto rendimiento con péptido cobre GHK-Cu y PDRN. Estimula el colágeno, regenera células y proporciona hidratación intensa 24h. Absorción avanzada para renovación completa de la piel.",badge:"Sérum",category:"serum",images:["./images/p1.png","./images/p2.png","./images/p3.png"],whatsappMessage:"¡Hola! Me interesa el Sérum GHK-Cu & PDRN de Elevia"}
  ]
};

// ─── STATE ──────────────────────────────────────────────────────
const WA="15147536580";
let currentLang='pt', currentCat='all', products=productData.pt, currentTab='home';
function t(key){return(i18n[currentLang]||i18n.pt)[key]||key}
function waLink(msg){return`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`}

// ─── CATEGORIES ─────────────────────────────────────────────────
function getCategories(){
  return[
    {id:'all',  name:t('cat_all'),  desc:t('cat_all_desc')},
    {id:'serum',name:t('cat_serum'),desc:t('cat_serum_desc')}
  ];
}

const ICONS={
  all:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>`,
  serum:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>`
};

// ─── DOM REFS ────────────────────────────────────────────────────
const homeView    = document.getElementById('home-view');
const catsView    = document.getElementById('cats-view');
const profileView = document.getElementById('profile-view');
const accessView  = document.getElementById('access-view');
const infoView    = document.getElementById('info-view');
const catListEl   = document.getElementById('cat-list');
const catsListEl  = document.getElementById('cats-list');
const gridEl      = document.getElementById('product-grid');
const secTitle    = document.getElementById('section-title');
const secCount    = document.getElementById('section-count');
const modal       = document.getElementById('product-modal');
const modalBody   = document.getElementById('modal-body');
const btnWa       = document.getElementById('btn-wa');
const searchModal = document.getElementById('search-modal');
const searchBtn   = document.getElementById('search-btn');
const searchCloseBtn = document.getElementById('search-close');
const searchInp   = document.getElementById('search-input');
const searchRes   = document.getElementById('search-results');
const navGlow     = document.getElementById('nav-glow');

// ─── APPLY I18N ──────────────────────────────────────────────────
function applyI18n(){
  // text nodes
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    const val=t(key);
    if(el.innerHTML!==val) el.innerHTML=val;
  });
  // placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.placeholder=t(el.dataset.i18nPlaceholder);
  });
  // flipper words
  document.querySelectorAll('[data-flip-key]').forEach(el=>{
    el.textContent=t(el.dataset.flipKey);
  });
}

// ─── NAV GLOW ────────────────────────────────────────────────────
function updateNavGlow(activeBtn){
  if(!activeBtn||!navGlow)return;
  const parent=activeBtn.closest('.bot-nav-inner');
  const pr=parent.getBoundingClientRect();
  const br=activeBtn.getBoundingClientRect();
  const cx=(br.left+br.right)/2-pr.left;
  navGlow.style.left=cx+'px';
  navGlow.style.opacity='1';
}

// ─── SLIDER ──────────────────────────────────────────────────────
function slider(images,name){
  if(!images||!images.length){
    return`<div class="card-img-placeholder"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>${t('photo_soon')}</span></div>`;
  }
  const hint=images.length>1?`<div class="swipe-hint">${t('swipe_hint')}</div>`:'';
  return`<div class="card-slider">${images.map(img=>`<div class="card-slide"><img src="${img}" alt="${name}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;font-family:Arial\\'>${t('photo_soon')}</div>'"></div>`).join('')}</div>${hint}`;
}

// ─── RENDER CAT BAR ──────────────────────────────────────────────
function renderCatBar(){
  const cats=getCategories();
  catListEl.innerHTML=cats.map(c=>{
    const isSerum=c.id==='serum';
    const badge=isSerum?`<span class="cat-drop-badge"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg></span>`:'';
    return`<button class="cat-btn${currentCat===c.id?' active':''}" data-category="${c.id}">${badge}${c.name}</button>`;
  }).join('');
  catListEl.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{currentCat=btn.dataset.category;renderCatBar();renderProducts()});
  });
}

// ─── RENDER PRODUCTS ─────────────────────────────────────────────
function renderProducts(){
  const filtered=currentCat==='all'?products:products.filter(p=>p.category===currentCat);
  const cats=getCategories();
  const cat=cats.find(c=>c.id===currentCat);
  secTitle.textContent=currentCat==='all'?t('sec_title_all'):(cat?cat.name:'');
  secCount.textContent=`${filtered.length} ${filtered.length===1?t('product_count_1'):t('product_count_n')}`;
  gridEl.innerHTML=filtered.map((p,i)=>`
    <article class="card${p.category==='serum'?' is-serum':''} animate-up" data-id="${p.id}" style="animation-delay:${i*60}ms">
      <div class="card-img-wrap">${slider(p.images,p.name)}<span class="card-badge">${p.badge}</span></div>
      <div class="card-body">
        <div><h3 class="card-name">${p.nameHtml}</h3><p class="card-desc">${p.description}</p></div>
        <button class="card-cta" data-wa="${p.whatsappMessage}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          ${t('card_cta')}
        </button>
      </div>
    </article>`).join('');
  bindCards(gridEl);
}

// ─── BIND CARDS ──────────────────────────────────────────────────
function bindCards(parent){
  parent.querySelectorAll('.card').forEach(card=>{
    let moved=false,sx,sl0,drag=false;
    const sl=card.querySelector('.card-slider');
    if(sl){
      sl.addEventListener('mousedown',e=>{drag=true;moved=false;sx=e.pageX-sl.offsetLeft;sl0=sl.scrollLeft;sl.style.scrollBehavior='auto'});
      sl.addEventListener('mouseleave',()=>drag=false);
      sl.addEventListener('mouseup',()=>{drag=false;sl.style.scrollBehavior='smooth'});
      sl.addEventListener('mousemove',e=>{if(!drag)return;e.preventDefault();const w=(e.pageX-sl.offsetLeft-sx)*2;if(Math.abs(w)>5)moved=true;sl.scrollLeft=sl0-w});
    }
    card.addEventListener('click',e=>{if(!e.target.closest('.card-cta')&&!moved)openModal(+card.dataset.id)});
  });
  parent.querySelectorAll('.card-cta').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();window.open(waLink(btn.dataset.wa),'_blank')});
  });
}

// ─── RENDER CATS VIEW ────────────────────────────────────────────
function renderCatsView(){
  const cats=getCategories();
  catsListEl.innerHTML=cats.map((c,i)=>`
    <button class="cat-card${c.id==='serum'?' is-serum':''} animate-up" data-category="${c.id}" style="animation-delay:${i*60}ms">
      <div class="cat-icon-box">${ICONS[c.id]||ICONS.all}</div>
      <div class="cat-info"><div class="cat-name">${c.name}</div><div class="cat-desc">${c.desc}</div></div>
      <div class="cat-arrow"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>
    </button>`).join('');
  catsListEl.querySelectorAll('.cat-card').forEach(card=>{
    card.addEventListener('click',()=>{currentCat=card.dataset.category;switchTab('home');renderCatBar();renderProducts()});
  });
}

// ─── MODAL ───────────────────────────────────────────────────────
function openModal(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  modalBody.innerHTML=`
    <div class="modal-img-wrap">${slider(p.images,p.name)}</div>
    <span class="modal-badge">${p.badge}</span>
    <h2 class="modal-name">${p.nameHtml}</h2>
    <p class="modal-desc">${p.description}</p>
    <div class="modal-feat"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg><span>${t('modal_certified')}</span></div>
    <div class="modal-feat"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><span>${t('modal_support')}</span></div>`;
  btnWa.href=waLink(p.whatsappMessage);
  document.getElementById('btn-wa-text').textContent=t('modal_cta');
  modal.classList.add('active');
  document.body.style.overflow='hidden';
}
function closeModal(){modal.classList.remove('active');document.body.style.overflow=''}

// ─── SWITCH TAB ──────────────────────────────────────────────────
function switchTab(tab){
  currentTab=tab;
  homeView.classList.toggle('hidden',    tab!=='home');
  catsView.classList.toggle('hidden',    tab!=='categories');
  profileView.classList.toggle('hidden', tab!=='profile');
  accessView.classList.toggle('hidden',  tab!=='access');
  infoView.classList.toggle('hidden',    tab!=='info');
  const navItems=document.querySelectorAll('.nav-item[data-tab]');
  navItems.forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));
  const activeNav=document.querySelector(`.nav-item[data-tab="${tab}"]`);
  if(activeNav)updateNavGlow(activeNav);
}

// ─── SEARCH ──────────────────────────────────────────────────────
function openSearch(){searchModal.classList.add('active');searchInp.focus();document.body.style.overflow='hidden'}
function closeSearch(){
  searchModal.classList.remove('active');
  searchInp.value='';
  document.body.style.overflow='';
  searchRes.innerHTML=`<div class="search-empty"><p>${t('search_type')}</p></div>`;
}
function renderSearch(q){
  if(!q.trim()){searchRes.innerHTML=`<div class="search-empty"><p>${t('search_type')}</p></div>`;return}
  const found=products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||p.description.toLowerCase().includes(q.toLowerCase()));
  if(!found.length){searchRes.innerHTML=`<div class="search-empty"><p>${t('search_none')}</p></div>`;return}
  searchRes.innerHTML=`<div class="product-grid">${found.map(p=>`<article class="card${p.category==='serum'?' is-serum':''}" data-id="${p.id}"><div class="card-img-wrap">${slider(p.images,p.name)}<span class="card-badge">${p.badge}</span></div><div class="card-body"><h3 class="card-name">${p.nameHtml}</h3><button class="card-cta" data-wa="${p.whatsappMessage}">${t('card_cta')}</button></div></article>`).join('')}</div>`;
  bindCards(searchRes);
}

// ─── SET LANG ────────────────────────────────────────────────────
function setLang(lang){
  currentLang=lang;
  products=productData[lang]||productData.pt;
  applyI18n();
  renderCatBar();
  renderProducts();
  renderCatsView();
  // sync all lang buttons (hero + any other selectors)
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===lang);
  });
  // update search placeholder & empty state
  searchInp.placeholder=t('search_placeholder');
  if(!searchInp.value.trim()){
    searchRes.innerHTML=`<div class="search-empty"><p>${t('search_type')}</p></div>`;
  }
}

// ─── EVENTS ──────────────────────────────────────────────────────
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
document.querySelectorAll('.nav-item[data-tab]').forEach(n=>n.addEventListener('click',()=>switchTab(n.dataset.tab)));
document.getElementById('modal-close').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
searchBtn.addEventListener('click',openSearch);
searchCloseBtn.addEventListener('click',closeSearch);
searchInp.addEventListener('input',e=>renderSearch(e.target.value));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSearch()}});

// ─── INIT ────────────────────────────────────────────────────────
applyI18n();
renderCatBar();
renderProducts();
renderCatsView();
setTimeout(()=>{
  const homeBtn=document.querySelector('.nav-item[data-tab="home"]');
  if(homeBtn)updateNavGlow(homeBtn);
},100);
</script>
</body>
</html>
